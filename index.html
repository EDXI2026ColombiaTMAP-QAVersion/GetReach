<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple Reach | CO team</title>
    <link rel="icon" type="image/png" href="./gull-bird-flying-shape.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="card">
      <div class="content">
        <div class="eyebrow">Reach analysis</div>
        <h1>Multiple Reach | CO team</h1>
        <p>Paste a list of URLs and get a clean monthly reach estimate.</p>
        <form id="uploadForm">
        <div class="drop">
          <textarea id="links" name="links" rows="10" placeholder="Paste one URL per line..."></textarea>
        </div>
        <div class="row">
          <button id="submitBtn" type="submit">Get Reach</button>
          <button id="copyBtn" class="secondary" type="button" disabled>Copy Results</button>
          <button id="copyMonthlyBtn" class="secondary" type="button" disabled>Copy Reach Values</button>
          <span id="status" class="status"></span>
        </div>
        </form>
        <div id="warning" class="small"></div>
        <!-- <div class="footer-hint">Tip: repeated domains are deduplicated automatically before querying metrics.</div> -->
        <div id="results" class="results"></div>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
