<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple Reach | CO team</title>
    <link rel="icon" type="image/png" href="./gull-bird-flying-shape.png" />
    <style>
      :root {
        --bg: #eef4ff;
        --bg-2: #f8fbff;
        --card: rgba(255, 255, 255, 0.86);
        --card-solid: #ffffff;
        --text: #10203a;
        --muted: #5f6c85;
        --accent: #315efb;
        --accent-2: #7c3aed;
        --accent-soft: rgba(49, 94, 251, 0.12);
        --success: #0f9d71;
        --warning: #b7791f;
        --border: rgba(16, 32, 58, 0.10);
        --shadow: 0 24px 80px rgba(16, 32, 58, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        width: 100%;
        font-family: "Segoe UI", "SF Pro Display", "Trebuchet MS", Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(49, 94, 251, 0.20) 0, transparent 30%),
          radial-gradient(circle at 85% 18%, rgba(124, 58, 237, 0.14) 0, transparent 24%),
          linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
        overflow-x: hidden;
      }
      .card {
        width: min(760px, 100%);
        margin: 0 auto;
        background: var(--card);
        backdrop-filter: blur(14px);
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 34px;
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(135deg, rgba(49, 94, 251, 0.07), transparent 35%),
          linear-gradient(320deg, rgba(124, 58, 237, 0.05), transparent 40%);
        pointer-events: none;
      }
      .content {
        position: relative;
        z-index: 1;
      }
      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 5vw, 3.5rem);
        line-height: 1.02;
        letter-spacing: -0.04em;
      }
      p { margin: 0 0 20px; color: var(--muted); line-height: 1.55; }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-2);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        margin-bottom: 14px;
      }
      .eyebrow::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
      }
      .drop {
        border: 1.5px solid rgba(49, 94, 251, 0.14);
        border-radius: 22px;
        padding: 24px;
        text-align: center;
        background: linear-gradient(180deg, rgba(248, 250, 255, 0.96), rgba(241, 246, 255, 0.92));
        margin-bottom: 18px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
      }
      textarea {
        width: 100%;
        min-height: 240px;
        resize: vertical;
        border: 0;
        outline: none;
        background: transparent;
        font: inherit;
        color: inherit;
        line-height: 1.5;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 14px 20px;
        font-weight: 700;
        letter-spacing: 0.01em;
        cursor: pointer;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #ffffff;
        box-shadow: 0 12px 28px rgba(49, 94, 251, 0.24);
        transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
      }
      button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 16px 32px rgba(49, 94, 251, 0.30);
      }
      button:active:not(:disabled) {
        transform: translateY(0);
      }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .status {
        margin-top: 14px;
        color: var(--muted);
        min-height: 1.4em;
        font-size: 0.95rem;
      }
      .note {
        margin-top: 16px;
        font-size: 0.95rem;
        color: var(--muted);
      }
      .small {
        margin-top: 10px;
        font-size: 0.9rem;
        color: var(--warning);
      }
      .results {
        margin-top: 22px;
        display: none;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--card-solid);
        box-shadow: 0 10px 30px rgba(16, 32, 58, 0.08);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95rem;
      }
      th, td {
        padding: 12px 14px;
        border-bottom: 1px solid rgba(16, 32, 58, 0.08);
        text-align: left;
        vertical-align: top;
      }
      th {
        background: linear-gradient(180deg, rgba(49, 94, 251, 0.10), rgba(49, 94, 251, 0.06));
        color: var(--text);
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      td { color: var(--text); }
      tr:hover td { background: rgba(49, 94, 251, 0.03); }
      textarea::placeholder { color: rgba(95, 108, 133, 0.72); }
      .footer-hint {
        margin-top: 14px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .row .secondary {
        background: rgba(49, 94, 251, 0.08);
        color: var(--accent-2);
        box-shadow: none;
        border: 1px solid rgba(49, 94, 251, 0.14);
      }
      .row .secondary:hover:not(:disabled) {
        background: rgba(49, 94, 251, 0.12);
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="content">
        <div class="eyebrow">Reach analysis</div>
        <h1>Multiple Reach | CO team</h1>
        <p>Paste a list of URLs and get a clean monthly reach estimate.</p>
        <form id="uploadForm">
        <div class="drop">
          <textarea id="links" name="links" rows="10" placeholder="Paste one URL per line..."></textarea>
        </div>
        <div class="row">
          <button id="submitBtn" type="submit">Get Reach</button>
          <button id="copyBtn" class="secondary" type="button" disabled>Copy Results</button>
          <button id="copyMonthlyBtn" class="secondary" type="button" disabled>Copy Reach Values</button>
          <span id="status" class="status"></span>
        </div>
        </form>
        <div id="warning" class="small"></div>
        <!-- <div class="footer-hint">Tip: repeated domains are deduplicated automatically before querying metrics.</div> -->
        <div id="results" class="results"></div>
      </div>
    </main>

    <script>
      const form = document.getElementById("uploadForm");
      const linksInput = document.getElementById("links");
      const statusEl = document.getElementById("status");
      const warningEl = document.getElementById("warning");
      const submitBtn = document.getElementById("submitBtn");
      const copyBtn = document.getElementById("copyBtn");
      const copyMonthlyBtn = document.getElementById("copyMonthlyBtn");
      const resultsEl = document.getElementById("results");

      function normalizeUrl(input) {
        const raw = String(input || "").trim();
        if (!raw) return "";
        if (/^https?:\/\//i.test(raw)) return raw;
        return `https://${raw}`;
      }

      function isLikelyUrl(input) {
        const raw = String(input || "").trim();
        if (!raw) return false;
        try {
          const url = new URL(normalizeUrl(raw));
          return Boolean(url.hostname && url.hostname.includes("."));
        } catch {
          return false;
        }
      }

      function extractDomain(input) {
        try {
          const url = new URL(normalizeUrl(input));
          return url.hostname.replace(/^www\./i, "").toLowerCase();
        } catch {
          return "";
        }
      }

      function escapeRegex(value) {
        return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }

      function parseMetricNearLabel(text, label) {
        const source = String(text || "");
        const pattern = new RegExp(
          `${escapeRegex(label)}[\\s\\S]{0,120}?([0-9][0-9.,]*\\s*[KM]?)`,
          "i"
        );
        const match = source.match(pattern);
        if (!match?.[1]) return "N/A";
        return match[1].replace(/\s+/g, "");
      }

      function parseHypestatMonthlyVisits(text) {
        const byLabel = parseMetricNearLabel(text, "Monthly Visits");
        return byLabel;
      }

      function parseSimilarWebMonthlyVisits(text) {
        return parseMetricNearLabel(text, "Monthly Visits (SimilarWeb)");
      }

      function parseNumericValue(value) {
        const raw = String(value || "").trim();
        if (!raw || raw === "N/A") return null;
        const compact = raw.replace(/,/g, "");
        const match = compact.match(/^([0-9]*\.?[0-9]+)([KM])?$/i);
        if (!match) return null;
        const num = Number(match[1]);
        if (!Number.isFinite(num)) return null;
        const suffix = (match[2] || "").toUpperCase();
        if (suffix === "K") return num * 1000;
        if (suffix === "M") return num * 1000000;
        return num;
      }

      function formatMonthlyValue(value) {
        if (!Number.isFinite(value)) return "N/A";
        return Math.round(value).toString();
      }

      function fetchWithTimeout(url, options = {}, timeoutMs = 8000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer));
      }

      async function fetchMetricsForDomain(domain) {
        if (!domain) {
          return {
            hypestatMonthlyVisits: "N/A",
            similarwebMonthlyVisits: "N/A"
          };
        }
        const directUrl = `https://hypestat.com/info/${encodeURIComponent(domain)}`;
        const proxyUrls = [
          directUrl,
          `https://api.allorigins.win/raw?url=${encodeURIComponent(directUrl)}`,
          `https://r.jina.ai/http://hypestat.com/info/${encodeURIComponent(domain)}`
        ];

        for (const url of proxyUrls) {
          try {
            const response = await fetchWithTimeout(url, {
              headers: { "accept": "text/html,text/plain,*/*" }
            }, 8000);
            if (!response.ok) continue;
            const body = await response.text();
            const parsed = {
              hypestatMonthlyVisits: parseHypestatMonthlyVisits(body),
              similarwebMonthlyVisits: parseSimilarWebMonthlyVisits(body)
            };
            if (
              parsed.hypestatMonthlyVisits !== "N/A" ||
              parsed.similarwebMonthlyVisits !== "N/A"
            ) {
              return parsed;
            }
          } catch (_) {
            // Try the next source.
          }
        }

        return {
          hypestatMonthlyVisits: "N/A",
          similarwebMonthlyVisits: "N/A"
        };
      }

      function makeTable(rows) {
        const table = document.createElement("table");
        table.innerHTML = `
          <thead>
            <tr><th>Link</th><th>Reach</th></tr>
          </thead>
          <tbody></tbody>
        `;
        const tbody = table.querySelector("tbody");
        rows.forEach((row) => {
          const tr = document.createElement("tr");
          tr.innerHTML = row
            .map((cell) => `<td>${String(cell || "").replace(/</g, "&lt;")}</td>`)
            .join("");
          tbody.appendChild(tr);
        });
        return table;
      }

      function makeCopyText(rows) {
        return rows.map((row) => row.join("\t")).join("\n");
      }

      function makeMonthlyOnlyText(rows) {
        return rows
          .map((row) => row[1])
          .join("\n");
      }

      async function mapLimit(items, limit, worker) {
        const results = new Array(items.length);
        let index = 0;

        async function run() {
          while (index < items.length) {
            const current = index++;
            results[current] = await worker(items[current], current);
          }
        }

        await Promise.all(Array.from({ length: Math.min(limit, items.length) }, run));
        return results;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const raw = String(linksInput.value || "").trim();
        if (!raw) return;

        submitBtn.disabled = true;
        copyBtn.disabled = true;
        copyMonthlyBtn.disabled = true;
        warningEl.textContent = "";
        statusEl.textContent = "Reading links...";
        resultsEl.style.display = "none";
        resultsEl.innerHTML = "";

        try {
          const rows = raw
            .split(/\r?\n/)
            .map((line) => line.trim())
            .filter(Boolean)
            .map((line) => [line]);
          const urls = rows.map((row) => row?.[0]).filter((value) => isLikelyUrl(value));
          const uniqueDomains = [...new Set(urls.map(extractDomain).filter(Boolean))];

          statusEl.textContent = `Checking 0 of ${uniqueDomains.length} domains...`;

          const results = await mapLimit(uniqueDomains, 2, async (domain, currentIndex) => {
            statusEl.textContent = `Checking ${currentIndex + 1} of ${uniqueDomains.length} domains... ${domain}`;
            const metrics = await fetchMetricsForDomain(domain);
            return [domain, metrics];
          });

          const lookup = new Map(results);
          const outputRows = rows.map((row) => {
            const original = row?.[0] ?? "";
            if (!isLikelyUrl(original)) {
              return [original, "N/A"];
            }
            const domain = extractDomain(original);
            const metrics = lookup.get(domain) || {
              hypestatMonthlyVisits: "N/A",
              similarwebMonthlyVisits: "N/A"
            };
            const numericValues = [
              parseNumericValue(metrics.hypestatMonthlyVisits),
              parseNumericValue(metrics.similarwebMonthlyVisits)
            ].filter((value) => Number.isFinite(value));
            const average = numericValues.length
              ? numericValues.reduce((sum, value) => sum + value, 0) / numericValues.length
              : null;
            return [original, formatMonthlyValue(average)];
          });

          resultsEl.innerHTML = "";
          resultsEl.appendChild(makeTable(outputRows.slice(0, 20)));
          resultsEl.style.display = "block";
          copyBtn.disabled = false;
          copyBtn.onclick = async () => {
            const copyText = makeCopyText(outputRows);
            await navigator.clipboard.writeText(copyText);
            statusEl.textContent = "Results copied to clipboard.";
          };
          copyMonthlyBtn.disabled = false;
          copyMonthlyBtn.onclick = async () => {
            const copyText = makeMonthlyOnlyText(outputRows);
            await navigator.clipboard.writeText(copyText);
            statusEl.textContent = "Reach values copied to clipboard.";
          };
          statusEl.textContent = "Done. The results are ready to copy.";
        } catch (error) {
          statusEl.textContent = error.message || "Could not process the file.";
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
